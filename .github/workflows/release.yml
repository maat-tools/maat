name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: bun run build

      - name: Packed-artifact smoke test (Node + Bun)
        run: bun run test:pack

      - name: Publish to npm
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for pkg in contracts vocabulary utils core kernel collector-ts collector-git enricher-llm coupling-rules connascence-rules presets-ts git-rules insights file-ledger cli; do
            dir="packages/$pkg"
            cp LICENSE "$dir/LICENSE"
            jq --arg v "$VERSION" '
              if .dependencies then .dependencies = (.dependencies | map_values(if test("^workspace:") then $v else . end)) else . end |
              if .peerDependencies then .peerDependencies = (.peerDependencies | map_values(if test("^workspace:") then $v else . end)) else . end
            ' "$dir/package.json" > "$dir/package.publish.json"
            mv "$dir/package.json" "$dir/package.json.orig"
            mv "$dir/package.publish.json" "$dir/package.json"
            (cd "$dir" && npm publish --access public)
            mv "$dir/package.json.orig" "$dir/package.json"
            rm -f "$dir/LICENSE"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
