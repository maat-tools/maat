name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate full CHANGELOG
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Bump versions in all packages
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for pkg in packages/*/package.json; do
            jq --arg v "$VERSION" '
              .version = $v |
              if .dependencies then .dependencies = (.dependencies | map_values(if test("^workspace:") then $v else . end)) else . end |
              if .peerDependencies then .peerDependencies = (.peerDependencies | map_values(if test("^workspace:") then $v else . end)) else . end
            ' "$pkg" > tmp.json && mv tmp.json "$pkg"
          done

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          for pkg in contracts vocabulary core kernel collector-ts collector-git coupling-rules connascence-rules file-ledger insights git-rules cli; do
            (cd packages/$pkg && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(release): ${{ github.ref_name }}"
          branch: "release/${{ github.ref_name }}"
          title: "chore(release): ${{ github.ref_name }}"
          body-path: RELEASE_NOTES.md
          base: main
          labels: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
